# =============================================================================
# ByteTrack Configuration
# =============================================================================
# ByteTrack 跟踪器配置文件
# 
# ByteTrack 是一种简单、快速、强大的多目标跟踪算法。
# 它的核心思想是：不仅使用高置信度的检测结果，也利用低置信度的检测结果
# 来恢复被遮挡的目标，从而提高轨迹的连续性。
#
# 参考: https://arxiv.org/abs/2110.06864

# 跟踪器类型
tracker_type: bytetrack

# 兼容说明：
# - 新版 Ultralytics 使用 track_high_thresh / track_low_thresh 字段
# - 旧版配置常用 track_thresh 字段
# 为避免不同版本字段不一致导致运行时报错，这里同时保留两套字段。

# -----------------------------------------------------------------------------
# 核心参数
# -----------------------------------------------------------------------------

# 轨迹缓冲帧数
# 当目标消失后，跟踪器会在接下来的 track_buffer 帧内保留该轨迹
# 值越大，遮挡恢复能力越强，但误关联风险也越高
# 推荐值: 30 (约1秒，假设30fps)
track_buffer: 30

# 高阈值 (track_high_thresh)
# 高于该阈值的检测结果被认为是"高置信度"，直接用于轨迹关联
# 推荐值: 0.5
track_high_thresh: 0.5

# 低阈值 (track_low_thresh)
# 在二阶段匹配中使用的低置信度阈值
# 推荐值: 0.1
track_low_thresh: 0.1

# 兼容旧字段（部分版本仍可能读取）
track_thresh: 0.5

# 新轨迹阈值 (new_track_thresh)
# 高于该阈值的检测结果可以创建新的轨迹
# 推荐值: 0.6 (比 track_thresh 稍高，避免频繁创建新轨迹)
new_track_thresh: 0.6

# 匹配阈值 (match_thresh)
# 轨迹与检测框之间的 IOU 阈值，用于判断是否匹配
# 值越大，匹配条件越严格
# 推荐值: 0.8
match_thresh: 0.8

# 是否在匹配时融合检测分数
fuse_score: true

# 最小匹配框面积
min_box_area: 10

# -----------------------------------------------------------------------------
# 高级参数（可选）
# -----------------------------------------------------------------------------

# 最小检测框面积
# 小于此面积的检测框将被过滤
# min_box_area: 10

# 最大检测框面积比例
# 大于此比例（相对于图像面积）的检测框将被过滤
# max_box_area_ratio: 0.8

# -----------------------------------------------------------------------------
# 说明
# -----------------------------------------------------------------------------
# 1. track_buffer 影响遮挡恢复能力:
#    - 较小值: 快速丢失遮挡目标，减少误关联
#    - 较大值: 更好的遮挡恢复，但可能产生轨迹漂移
#
# 2. track_thresh 影响跟踪稳定性:
#    - 较低值: 使用更多检测结果，提高召回率
#    - 较高值: 只使用高置信度检测，提高精确度
#
# 3. match_thresh 影响关联严格程度:
#    - 较低值: 更宽松的匹配，可能产生误关联
#    - 较高值: 更严格的匹配，可能丢失快速移动目标
